name: Aggiorna IPTV Grado

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

concurrency:
  group: aggiorna-iptv-grado
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aggiorna playlist
        run: python scripts/update_playlist.py

      - name: Aggiorna EPG
        run: python scripts/update_epg.py

      - name: Verifica EPG generato
        shell: bash
        run: |
          if [ ! -s EPG_Grado.xml ]; then
            echo "ERRORE: EPG_Grado.xml è vuoto."
            exit 1
          fi

          EPG_SIZE=$(stat -c%s EPG_Grado.xml)

          echo "Dimensione EPG generato: $EPG_SIZE bytes"

          if [ "$EPG_SIZE" -lt 1000000 ]; then
            echo "ERRORE: EPG_Grado.xml è troppo piccolo."
            exit 1
          fi

          echo "EPG verificato correttamente."

      - name: Pubblica aggiornamenti
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add IPTV_Grado_Full_v1.0.m3u EPG_Grado.xml

          if git diff --cached --quiet; then
            echo "Nessun aggiornamento necessario."
            exit 0
          fi

          echo "File da pubblicare:"
          git diff --cached --stat

          git commit -m "Aggiornamento automatico IPTV Grado + EPG"
          git push
